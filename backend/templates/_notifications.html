{# In-app notifications: bell + unread badge + dropdown panel.
   Included by the app headers. Degrades to nothing without JS. #}
<div class="notif" id="notifRoot">
  <button id="notifBell" class="notif-bell" type="button"
          aria-haspopup="dialog" aria-expanded="false" aria-controls="notifPanel"
          aria-label="Notifications">
    <svg class="notif-bell-icon" viewBox="0 0 24 24" width="20" height="20"
         aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-5.6V10a7 7 0 0 0-5.25-6.77V2.5a1.75 1.75 0 0 0-3.5 0v.73A7 7 0 0 0 5 10v6.4l-1.4 2.4a.9.9 0 0 0 .8 1.3h15.2a.9.9 0 0 0 .8-1.3Z"/>
    </svg>
    <span class="notif-badge" id="notifBadge" hidden>0</span>
  </button>

  <div class="notif-panel" id="notifPanel" role="dialog" aria-label="Notifications" hidden>
    <div class="notif-panel-head">
      <span>Notifications</span>
      <button id="notifMarkAll" class="notif-mark-all" type="button">Mark all read</button>
    </div>
    <div class="notif-list" id="notifList"></div>
    <p class="notif-empty" id="notifEmpty" hidden>You're all caught up.</p>
  </div>
</div>
