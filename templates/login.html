<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoomSplit — Shared expenses, sorted</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1><span style="color:var(--mint)">Room</span>Split</h1>
    <p class="sub" id="authSub">Log in to see who owes whom.</p>
    <div id="errorBox" class="error-msg" hidden></div>

    <form id="loginForm">
      <label>Phone number
        <input type="tel" id="loginPhone" placeholder="98xxxxxxxx" required>
      </label>
      <label>4-digit PIN
        <input type="password" id="loginPin" maxlength="4" inputmode="numeric" placeholder="••••" required>
      </label>
      <button class="btn-primary" type="submit">Log in</button>
    </form>

    <form id="signupForm" hidden>
      <label>Your name
        <input type="text" id="signupName" placeholder="Full name" required>
      </label>
      <label>Phone number
        <input type="tel" id="signupPhone" placeholder="98xxxxxxxx" required>
      </label>
      <label>Set a 4-digit PIN
        <input type="password" id="signupPin" maxlength="4" inputmode="numeric" placeholder="••••" required>
      </label>
      <button class="btn-primary" type="submit">Create account</button>
    </form>

    <div class="auth-switch">
      <span id="switchText">New here?</span>
      <button type="button" id="switchBtn">Create an account</button>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
