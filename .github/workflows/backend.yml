name: Backend CI/CD

on:
  push:
    branches:
      - backend
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - backend
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Test & Build (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitty_user
          POSTGRES_PASSWORD: kitty_password
          POSTGRES_DB: kitty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Application Compilation & Health
        env:
          DATABASE_URL: postgresql://kitty_user:kitty_password@localhost:5432/kitty_test
          SECRET_KEY: test-ci-secret-key-for-backend-runs
          FLASK_ENV: testing
        run: |
          cd backend
          python -c "import app, models, engine; print('All backend modules compiled and verified successfully')"

      - name: Validate Docker Container Build
        run: |
          docker build -t kitty-backend:latest ./backend

  deploy:
    name: Deploy Backend
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/backend' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Render Deployment Hook (Triggered if RENDER_DEPLOY_HOOK is configured)
      - name: Trigger Render Deploy Hook (Optional)
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render deployment..."
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      # Railway Deployment Hook (Triggered if RAILWAY_DEPLOY_HOOK is configured)
      - name: Trigger Railway Deploy Hook (Optional)
        if: env.RAILWAY_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Railway deployment..."
          curl -sS -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}

      # Docker Hub publish (Triggered if DOCKERHUB_USERNAME & DOCKERHUB_TOKEN are set)
      - name: Log in to Docker Hub (Optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image (Optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kitty-backend:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deployment Status Summary
        run: |
          echo "=========================================="
          echo "Backend CI/CD Pipeline Completed Successfully!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="
