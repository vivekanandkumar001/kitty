<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Rooms — RoomSplit</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand"><span class="dot"></span>RoomSplit</div>
    <div class="topbar-actions">
      <span id="userName" style="opacity:.8"></span>
      <button id="logoutBtn">Log out</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="rooms-header">
    <h1>Your rooms</h1>
    <p>Pick a room to see balances, or set up a new one below.</p>
  </div>

  <div id="roomsGrid" class="rooms-grid"></div>
  <p class="empty-state" id="roomsEmpty" hidden>No rooms yet — create one or join with a code below.</p>

  <div class="room-actions-row">
    <div class="action-card">
      <h3>Create a room</h3>
      <input type="text" id="newRoomName" placeholder="e.g. Flat 302">
      <button class="btn-primary" id="createRoomBtn">Create room</button>
    </div>
    <div class="action-card">
      <h3>Join with a code</h3>
      <input type="text" id="joinCode" placeholder="e.g. RL9J87" style="text-transform:uppercase">
      <button class="btn-primary" id="joinRoomBtn">Join room</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/rooms.js') }}"></script>
</body>
</html>
